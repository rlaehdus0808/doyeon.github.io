<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="#bdd3d6" name="theme-color"/>
<meta content="Doyeon Kim's personal academic homepage" name="description"/>
<title>Doyeon Kim | Homepage</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=DM+Serif+Display&amp;family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Nunito:wght@400;600;700&amp;family=Gowun+Dodum&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Noto+Serif+KR:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="style.css" rel="stylesheet"/>

</head>
<body>
<div aria-hidden="true" class="grain"></div>
<header class="site-header">
<div class="container header-row">
<div aria-label="Language / 언어" class="language-toggle" role="group">
<button aria-pressed="false" class="language-button" data-lang="ko" type="button">한국어</button>
<span aria-hidden="true" class="language-sep">/</span>
<button aria-pressed="true" class="language-button" data-lang="en" type="button">EN</button>
</div>
</div>
</header>
<main class="landing">
<section aria-labelledby="hello-title" class="hero" id="home">
<div class="container hero-inner">
<div class="hero-copy" lang="en">
<h1 id="hello-title">
<span class="hero-hello" id="hero-hello">Hello!</span>
<span class="hero-name" id="hero-name">I'm Doyeon Kim.</span>
</h1>
<p class="hero-subtitle" id="hero-subtitle">M.S. Student · Chung-Ang University</p>
<div aria-label="Research interests" class="hero-interests" id="hero-interests">
<span class="hero-interest">Machine Learning</span>
<span class="hero-interest">Multimodal AI</span>
<span class="hero-interest">Data Science</span>
</div>
</div>
<aside aria-labelledby="contact-title" class="contact-note" lang="en">
<span aria-hidden="true" class="note-paperclip"></span>
<p class="note-brow">A NOTE FROM MY DESK</p>
<h2 id="contact-title">Contact</h2>
<div aria-label="Contact and profile links" class="quick-links" id="contact-links"></div>
</aside>
</div>
</section>
<section aria-labelledby="folders-title" class="folders-section" id="folders">
<div class="container folder-layout">
<div class="section-topline">
<h2 id="folders-title">Choose a folder<span>.</span></h2>
</div>
<div class="folder-grid" id="folder-grid">
<button aria-haspopup="dialog" class="folder-item folder--mocha" data-folder="about" type="button">
<span aria-hidden="true" class="folder-art"><span class="folder-tab"></span><span class="folder-face"><span class="folder-index">01</span></span></span>
<span class="folder-label" data-folder-label="about">About me</span>
</button>
<button aria-haspopup="dialog" class="folder-item folder--cocoa" data-folder="education" type="button">
<span aria-hidden="true" class="folder-art"><span class="folder-tab"></span><span class="folder-face"><span class="folder-index">02</span></span></span>
<span class="folder-label" data-folder-label="education">Education</span>
</button>
<button aria-haspopup="dialog" class="folder-item folder--linen" data-folder="skills" type="button">
<span aria-hidden="true" class="folder-art"><span class="folder-tab"></span><span class="folder-face"><span class="folder-index">03</span></span></span>
<span class="folder-label" data-folder-label="skills">Skills</span>
</button>
<button aria-haspopup="dialog" class="folder-item folder--rose" data-folder="projects" type="button">
<span aria-hidden="true" class="folder-art"><span class="folder-tab"></span><span class="folder-face"><span class="folder-index">04</span></span></span>
<span class="folder-label" data-folder-label="projects">Projects</span>
</button>
</div>
<p class="footer" id="footer-text">© 2026 Doyeon Kim</p>
</div>
</section>
</main>
<dialog aria-labelledby="dialog-title" class="folder-dialog" id="folder-dialog">
<div class="dialog-paper">
<span aria-hidden="true" class="note-paperclip dialog-paperclip"></span>
<button aria-label="Close folder" class="dialog-close" id="dialog-close" type="button">×</button>
<p class="dialog-kicker" id="dialog-kicker">FOLDER / 01</p>
<h2 id="dialog-title">About me</h2>
<div aria-hidden="true" class="dialog-rule"></div>
<div class="dialog-content" id="dialog-content"></div>
</div>
</dialog>
<script src="content.js"></script>
<script src="main.js"></script>
</body>
</html>
